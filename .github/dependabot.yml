# Dependabot configuration
# Cooldown delays updating normal npm dependencies by 7 days but allows security updates to be
# processed immediately. Note: cooldown is not supported for the github-actions ecosystem.
# Reference: https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference
version: 2
updates:

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'cron'
      timezone: 'Europe/Berlin'
      cronjob: '40 2 14 * *'
    open-pull-requests-limit: 15
    assignees:
      - joltcoke

  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'cron'
      timezone: 'Europe/Berlin'
      cronjob: '40 2 14 * *'
    open-pull-requests-limit: 15
    versioning-strategy: 'increase'
    assignees:
      - joltcoke
    ignore:
      # the major version has to follow the minimum node.js version of the adapter, not the newest release
      - dependency-name: '@types/node'
        update-types:
          - 'version-update:semver-major'
      # typescript-eslint declares support for '>=4.8.4 <6.1.0', and @iobroker/eslint-config pins it
      # to ^8 - so typescript 7 would make the lint step run on an unsupported compiler
      - dependency-name: 'typescript'
        update-types:
          - 'version-update:semver-major'
    cooldown:
      default-days: 7

  # admin GUI component, built by "npm run build:admin"
  - package-ecosystem: 'npm'
    directory: '/src-admin'
    schedule:
      interval: 'cron'
      timezone: 'Europe/Berlin'
      cronjob: '40 2 14 * *'
    open-pull-requests-limit: 15
    versioning-strategy: 'increase'
    assignees:
      - joltcoke
    ignore:
      - dependency-name: '@types/node'
        update-types:
          - 'version-update:semver-major'
      # kept in step with the main package, see above
      - dependency-name: 'typescript'
        update-types:
          - 'version-update:semver-major'
    cooldown:
      default-days: 7
